services:
  db:
    image: postgres:16-alpine
    container_name: lms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: lms
    ports:
      - "5434:5432"
    volumes:
      - lms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lms-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - lms_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    container_name: lms-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: /api
      JITSI_HOST: 8x8.vc
      JITSI_APP_ID: vpaas-magic-cookie-53f09f1585e3451db5926c020e312535
      DATABASE_URL: postgresql://postgres.gbakcmyzrhommepdeprs:t38g2Hwe8g8NjQdf@aws-0-ap-south-1.pooler.supabase.com:5432/postgres?pgbouncer=true&connection_limit=5&connect_timeout=15&pool_timeout=20
      R2_ACCOUNT_ID: 1b05942a42d8885049d82d5ac2280901
      R2_ENDPOINT: https://1b05942a42d8885049d82d5ac2280901.r2.cloudflarestorage.com
      R2_BUCKET: qtest
      R2_PUBLIC_URL: https://pub-1d6b172b10c1407cb567d7ec021d92fc.r2.dev
      R2_ACCESS_KEY_ID: 7416adfe21fcab2266a79f4e2ada2004
      R2_SECRET_ACCESS_KEY: 8a8bce50648c5e8c37d7065a23bcb50028430efdde47e12b25c867388162954a

volumes:
  lms_pgdata:
  lms_redisdata: